<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0F172A"/>
  <!-- Clean tiles -->
  <rect x="100" y="200" width="600" height="240" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
  <!-- Smooth crisp silicone sealant barrier -->
  <path d="M100 200 L 700 200" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 200 L 700 200" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Shield protection icon -->
  <g transform="translate(400, 310)">
    <circle cx="0" cy="0" r="32" fill="#16A34A" opacity="0.15"/>
    <path d="M0 -18 L18 -10 V6 C18 18 0 24 0 24 C0 24 -18 18 -18 6 V-10 Z" fill="#16A34A"/>
    <path d="M-6 3 L-2 7 L6 -3" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Success badge -->
  <rect x="220" y="40" width="360" height="46" rx="8" fill="#16A34A" opacity="0.95"/>
  <text x="400" y="70" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">AFTER: Anti-Fungal 100% Waterproof Barrier</text>
</svg>
