<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#1E293B"/>
  <!-- Bathroom / Balcony joint -->
  <rect x="100" y="200" width="600" height="240" fill="#334155" stroke="#475569" stroke-width="4"/>
  <!-- Deteriorated mouldy cracked sealant -->
  <path d="M100 200 L 700 200" stroke="#000000" stroke-width="18" stroke-linecap="round"/>
  <!-- Black mould spots -->
  <circle cx="200" cy="200" r="14" fill="#09090B"/>
  <circle cx="340" cy="200" r="18" fill="#09090B"/>
  <circle cx="480" cy="200" r="16" fill="#09090B"/>
  <circle cx="620" cy="200" r="12" fill="#09090B"/>
  <!-- Water seepage marks -->
  <path d="M220 215 C 230 280, 260 320, 240 400" stroke="#0284C7" stroke-width="4" opacity="0.6"/>
  <path d="M490 215 C 500 270, 480 340, 520 410" stroke="#0284C7" stroke-width="4" opacity="0.6"/>
  <!-- Warning badge -->
  <rect x="230" y="40" width="340" height="46" rx="8" fill="#DC2626" opacity="0.95"/>
  <text x="400" y="70" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">BEFORE: Mouldy Sealant & Water Ingress</text>
</svg>
