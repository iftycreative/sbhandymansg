<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" fill="#0B1B3D"/>
  <defs>
    <linearGradient id="paintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#paintGrad)"/>
  <g transform="translate(300, 200)">
    <!-- Paint roller & strokes -->
    <rect x="-140" y="-80" width="280" height="60" rx="6" fill="#FF5E14"/>
    <rect x="-140" y="-10" width="280" height="80" rx="6" fill="#FFA573" opacity="0.6"/>
    <!-- Roller frame -->
    <path d="M140 -50 L 170 -50 L 170 30 L 10 30 L 10 90" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
    <rect x="0" y="80" width="20" height="60" rx="4" fill="#334155"/>
  </g>
  <rect x="30" y="370" width="160" height="32" rx="6" fill="rgba(255,94,20,0.2)" stroke="#FF5E14"/>
  <text x="110" y="391" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Painting Service</text>
</svg>
