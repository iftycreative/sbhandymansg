<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D"/>
      <stop offset="60%" stop-color="#162C5B"/>
      <stop offset="100%" stop-color="#0F2347"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF5E14"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#heroBg)"/>

  <!-- Interior Singapore Living Room Architectural Blueprint Overlay -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="80" x2="80" y2="520"/>
    <line x1="720" y1="80" x2="720" y2="520"/>
    <line x1="80" y1="520" x2="720" y2="520"/>
    <rect x="140" y="140" width="160" height="120" stroke-dasharray="6 4"/>
    <rect x="500" y="140" width="160" height="120" stroke-dasharray="6 4"/>
    <circle cx="400" cy="300" r="120" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Professional Handyman Shield / Precision Emblem -->
  <g transform="translate(400, 260)" filter="url(#cardGlow)">
    <!-- Outer Crest -->
    <path d="M0 -150 L140 -80 V60 C140 140 0 200 0 200 C0 200 -140 140 -140 60 V-80 Z" fill="#0A192F" stroke="url(#goldAcc)" stroke-width="4"/>
    
    <!-- Inner Shield Gradient -->
    <path d="M0 -130 L120 -70 V50 C120 120 0 175 0 175 C0 175 -120 120 -120 50 V-70 Z" fill="#162C5B" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

    <!-- Crossed Tools Iconography -->
    <!-- Wrench -->
    <g transform="rotate(35) translate(-10, -70)">
      <rect x="-8" y="0" width="16" height="140" rx="6" fill="#E2E8F0"/>
      <path d="M-20 -20 C-20 10 20 10 20 -20 C10 -30 -10 -30 -20 -20 Z" fill="#CBD5E1"/>
      <circle cx="0" cy="-10" r="10" fill="#162C5B"/>
    </g>
    <!-- Screwdriver / Level -->
    <g transform="rotate(-35) translate(0, -70)">
      <rect x="-8" y="0" width="16" height="140" rx="6" fill="#FF5E14"/>
      <rect x="-14" y="-30" width="28" height="40" rx="4" fill="#0F172A"/>
    </g>

    <!-- Star Badges -->
    <circle cx="0" cy="30" r="28" fill="#FF5E14" stroke="#FFFFFF" stroke-width="3"/>
    <text x="0" y="38" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="20" font-weight="800" text-anchor="middle">24/7</text>
  </g>

  <!-- Floating Feature Chips -->
  <g transform="translate(100, 160)" filter="url(#cardGlow)">
    <rect width="210" height="54" rx="27" fill="#0B1B3D" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="16" fill="#22C55E"/>
    <path d="M22 27 L26 31 L34 23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="32" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Singapore Islandwide</text>
  </g>

  <g transform="translate(490, 420)" filter="url(#cardGlow)">
    <rect width="210" height="54" rx="27" fill="#0B1B3D" stroke="#FF5E14" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="16" fill="#FF5E14"/>
    <text x="28" y="33" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">⚡</text>
    <text x="56" y="32" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Rapid Response Team</text>
  </g>
</svg>
