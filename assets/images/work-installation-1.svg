<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <rect width="600" height="450" fill="#0B1B3D"/>
  <defs>
    <linearGradient id="instGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#0B1B3D"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#instGrad)"/>
  <g transform="translate(300, 200)">
    <!-- Wall mount TV / Fixture Installation visual -->
