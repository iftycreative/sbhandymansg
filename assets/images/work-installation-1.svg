  </g>
  <rect x="30" y="370" width="160" height="32" rx="6" fill="rgba(255,94,20,0.2)" stroke="#FF5E14"/>
  <text x="110" y="391" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Mounting & Install</text>
</svg>
