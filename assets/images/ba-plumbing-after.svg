<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0F172A"/>
  <!-- Clean tiled background -->
  <defs>
    <pattern id="cleanTiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#cleanTiles)"/>
  <!-- Shiny Stainless Steel Pipe -->
  <rect x="365" y="0" width="70" height="500" fill="#94A3B8" rx="6"/>
  <rect x="375" y="0" width="20" height="500" fill="#FFFFFF" opacity="0.6"/>
  <!-- Brass Pressure Fitting & Ball Valve -->
  <rect x="345" y="200" width="110" height="70" rx="10" fill="#D97706"/>
  <rect x="350" y="210" width="100" height="50" rx="6" fill="#F59E0B"/>
  <!-- Valve Handle -->
  <rect x="320" y="175" width="160" height="20" rx="6" fill="#FF5E14"/>
  <circle cx="400" cy="185" r="8" fill="#FFFFFF"/>
  <!-- Pipe Brackets -->
  <rect x="340" y="70" width="120" height="24" rx="6" fill="#475569"/>
  <rect x="340" y="390" width="120" height="24" rx="6" fill="#475569"/>
  <!-- Success Badge -->
  <rect x="250" y="40" width="300" height="46" rx="8" fill="#16A34A" opacity="0.95"/>
  <text x="400" y="70" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">AFTER: High-Grade Valve & Leakproof Seal</text>
</svg>
