<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162C5B"/>
      <stop offset="100%" stop-color="#0B1B3D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Grid lines -->
  <g opacity="0.15" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="50" y1="0" x2="50" y2="380" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="250" y1="0" x2="250" y2="380" />
    <line x1="350" y1="0" x2="350" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Singapore Island Silhouette Map Outline -->
  <path d="M110 220 C 130 180, 160 140, 220 130 C 260 120, 310 110, 370 125 C 430 140, 480 150, 520 190 C 545 215, 520 250, 460 260 C 400 270, 340 280, 280 275 C 210 270, 150 265, 120 245 Z" 
        fill="url(#mapGrad)" stroke="#FF5E14" stroke-width="2" opacity="0.9" />

  <!-- Jurong Island & Offshore Islands -->
  <path d="M130 270 C 150 265, 170 275, 160 290 C 145 295, 125 285, 130 270 Z" fill="#162C5B" stroke="#FF5E14" stroke-width="1.5" />
  <path d="M320 300 C 350 295, 365 315, 340 320 C 320 320, 310 305, 320 300 Z" fill="#162C5B" stroke="#FF5E14" stroke-width="1.5" />
  <path d="M480 130 C 500 125, 515 145, 495 155 C 475 155, 470 135, 480 130 Z" fill="#162C5B" stroke="#FF5E14" stroke-width="1.5" />

  <!-- Region Labels and Pulse Markers -->
  
  <!-- Central Singapore (Serangoon HQ) -->
  <g transform="translate(300, 205)">
    <circle cx="0" cy="0" r="14" fill="#FF5E14" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#FF5E14" stroke="#FFFFFF" stroke-width="2" />
    <rect x="-85" y="-36" width="170" height="26" rx="6" fill="#0A192F" stroke="#FF5E14" stroke-width="1" />
    <text x="0" y="-19" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Central (578 Serangoon Rd)</text>
  </g>

  <!-- East Region -->
  <g transform="translate(450, 195)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="-40" y="-28" width="80" height="22" rx="4" fill="#0B1B3D" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="-13" fill="#E2E8F0" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" text-anchor="middle">East Region</text>
  </g>

  <!-- West Region -->
  <g transform="translate(170, 200)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="-40" y="-28" width="80" height="22" rx="4" fill="#0B1B3D" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="-13" fill="#E2E8F0" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" text-anchor="middle">West Region</text>
  </g>

  <!-- North Region -->
  <g transform="translate(290, 140)">
    <circle cx="0" cy="0" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="-42" y="-28" width="84" height="22" rx="4" fill="#0B1B3D" stroke="#38BDF8" stroke-width="1" />
    <text x="0" y="-13" fill="#E2E8F0" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" text-anchor="middle">North Region</text>
  </g>

  <!-- Service Badge Indicator -->
  <g transform="translate(30, 320)">
    <rect width="210" height="34" rx="17" fill="#0B1B3D" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <circle cx="18" cy="17" r="6" fill="#22C55E" />
    <text x="32" y="22" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="11" font-weight="700">100% Islandwide Coverage</text>
  </g>
</svg>
