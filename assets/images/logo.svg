<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52" fill="none">
  <defs>
    <linearGradient id="sbLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D"/>
      <stop offset="100%" stop-color="#162C5B"/>
    </linearGradient>
    <linearGradient id="sbAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30"/>
      <stop offset="100%" stop-color="#FF5E14"/>
    </linearGradient>
    <filter id="sbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B1B3D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Shield Badge -->
  <rect x="2" y="2" width="48" height="48" rx="14" fill="url(#sbLogoBg)" filter="url(#sbGlow)" stroke="url(#sbAccentGrad)" stroke-width="1.5"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="4.5" y="4.5" width="43" height="43" rx="11.5" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Modern House Roofline (Orange Accent) -->
  <path d="M14 23.5 L26 12.5 L38 23.5" stroke="url(#sbAccentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chimney / Fixture Line -->
  <path d="M32 17.5 V15 H35 V20.5" stroke="url(#sbAccentGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Wrench Silhouette (White) -->
  <path d="M26 19 L26 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 38 H30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stylized Monogram S and B Curves -->
  <!-- Left Side: 'S' Curve Motif -->
  <path d="M19 26 C17 26 16 27.5 16 29 C16 31 18 31.5 20 32 C22 32.5 23 33.5 23 35 C23 37 21 38 18 38 C16.5 38 15 37.5 14 36.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Side: 'B' Motif -->
  <path d="M29 26 H33.5 C35.5 26 36.5 27.2 36.5 29 C36.5 30.5 35.5 31.5 33.5 32 C36 32 37 33.2 37 35 C37 36.8 35.5 38 33 38 H29" stroke="url(#sbAccentGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Golden Spark / Precision Dot -->
  <circle cx="26" cy="22" r="2.5" fill="#FFB800"/>
</svg>
