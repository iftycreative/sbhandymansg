<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="freshWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#freshWall)"/>
  <!-- Elegant architectural moulding line -->
  <rect x="0" y="440" width="800" height="60" fill="#CBD5E1"/>
  <rect x="0" y="436" width="800" height="4" fill="#94A3B8"/>
  <rect x="0" y="430" width="800" height="6" fill="#FFFFFF"/>
  <!-- Modern Wall Art Frame -->
  <rect x="260" y="140" width="280" height="200" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="8"/>
  <rect x="290" y="170" width="220" height="140" fill="#0B1B3D"/>
  <circle cx="400" cy="240" r="40" fill="#FF5E14"/>
  <!-- Success badge -->
  <rect x="250" y="40" width="300" height="46" rx="8" fill="#16A34A" opacity="0.95"/>
  <text x="400" y="70" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">AFTER: Smooth Premium 3-Coat Finish</text>
</svg>
