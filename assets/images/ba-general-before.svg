<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#1E293B"/>
  <!-- Wooden door texture -->
  <rect x="220" y="50" width="360" height="400" rx="6" fill="#78350F" stroke="#451A03" stroke-width="6"/>
  <!-- Broken loose lock & handle -->
  <g transform="rotate(18 360 250)">
    <rect x="300" y="210" width="100" height="130" rx="8" fill="#475569" stroke="#334155" stroke-width="3"/>
    <circle cx="350" cy="245" r="16" fill="#1E293B"/>
    <rect x="250" y="235" width="110" height="20" rx="6" fill="#64748B"/>
  </g>
  <!-- Scratches -->
  <line x1="390" y1="210" x2="430" y2="240" stroke="#B45309" stroke-width="3"/>
  <line x1="380" y1="270" x2="440" y2="290" stroke="#B45309" stroke-width="3"/>
  <!-- Warning badge -->
  <rect x="240" y="30" width="320" height="46" rx="8" fill="#DC2626" opacity="0.95"/>
  <text x="400" y="60" fill="#FFFFFF" font-family="'Manrope', sans-serif" font-size="16" font-weight="800" text-anchor="middle">BEFORE: Loose Latch & Jamming Handle</text>
</svg>
